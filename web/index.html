<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新番追番日历</title>
    <script>
      // 主题偏好要在第一帧之前落到 <html> 上，否则会先闪一下系统主题。
      try {
        var savedTheme = localStorage.getItem('anime-tracker.theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.classList.add('theme-' + savedTheme);
        }
      } catch (error) {
        /* 隐私模式读不了 localStorage，就按系统主题来 */
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <div class="brand-text">
          <h1>新番追番日历</h1>
          <span class="brand-sub">放送表 · <span class="season-badge" id="season-badge">—</span></span>
        </div>
      </div>

      <div class="controls">
        <label class="field">
          <span>季度</span>
          <select id="season-select"></select>
        </label>

        <label class="field">
          <span>归属</span>
          <select id="rule-select">
            <option value="clock">按真实钟点</option>
            <option value="broadcast-calendar">按日本放送日历</option>
          </select>
        </label>

        <button
          id="update-btn"
          class="btn btn-primary"
          title="更新数据：先选要抓哪些季度（默认只更新当季，也可以勾库里还没有的老季度），再抓取 → 官方译名替换临时机翻 → 缺中文名的做临时机翻"
        >
          更新数据
        </button>

        <!--
          长任务（更新数据 / 补中文名）跑起来时出现：抓十几季 + 翻几百条要几分钟，
          没有它就只能干等。停止是"当前这一季做完就收尾"，已落库的数据一律保留。
        -->
        <button id="cancel-btn" class="btn" hidden title="停止当前的长任务（已抓到的数据会保留）">停止</button>

        <!--
          低频操作收进「更多」菜单：顶栏原来是 5 个按钮 + 2 个下拉挤成一排，
          窄一点的窗口会换行成两三层。功能一个没少，只是不再占主视线。
        -->
        <details class="menu" id="more-menu">
          <summary class="btn" title="同步、导出与主题">更多 <span class="caret">▾</span></summary>
          <div class="menu-panel">
            <button id="sync-btn" class="btn" title="只抓取当前选中的这一季（更快）">只同步本季</button>
            <button
              id="translate-btn"
              class="btn"
              title="给缺中文名的番加上临时机翻名；官方译名一到，更新数据时会自动替换"
            >
              补全中文名（机翻）
            </button>
            <a id="ics-link" class="btn" href="/api/ics" title="导入手机系统日历，之后不打开本页面也能看"
              >导出日历 (.ics)</a
            >
            <a
              id="export-link"
              class="btn"
              href="/api/export"
              title="把你的追番列表、进度、手动修正、变更历史导出成 JSON —— 这些数据不可重建，建议定期留一份"
              >导出我的数据</a
            >

            <div class="menu-section">
              <span class="menu-label">主题</span>
              <div class="theme-switch" role="group" aria-label="主题">
                <button class="btn" data-theme="auto" aria-pressed="true" title="跟随系统设置，系统切换时页面也跟着变">
                  跟随系统
                </button>
                <button class="btn" data-theme="light" aria-pressed="false" title="强制浅色，不受系统影响">
                  浅色
                </button>
                <button class="btn" data-theme="dark" aria-pressed="false" title="强制深色，不受系统影响">
                  深色
                </button>
              </div>
            </div>
          </div>
        </details>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab is-active" data-view="week">周视图</button>
      <button class="tab" data-view="season">全季总览</button>
      <button class="tab" data-view="my">我的追番 <span class="pill" id="tab-my-count">0</span></button>
      <button class="tab" data-view="changes">变更 <span class="pill" id="tab-changes-count">0</span></button>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
    </nav>

    <main id="app">
      <div class="loading">正在加载…</div>
    </main>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
